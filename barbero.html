<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del Barbero</title>
  <link rel="stylesheet" href="barbero.css">
</head>
<body>

<div id="login">
  <input id="usuario" placeholder="Usuario">
  <input id="password" type="password" placeholder="Contraseña">
  <button id="btnLogin">Entrar</button>
  <p id="error"></p>
</div>

<div id="panel" style="display:none">

  <h2>Citas</h2>

  <input type="number" id="filtroDia" placeholder="Día">
  <button onclick="mostrarCitas()">Filtrar</button>

  <div id="listaCitas"></div>

  <button onclick="logout()">Salir</button>
</div>

<script src="barbero.js"></script>
</body>
</html>
