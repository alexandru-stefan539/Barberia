<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Barbería Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Barbería Profesional</h1>
  <p>Reserva tu cita</p>
</header>

<section class="seccion">
  <h2>Servicios</h2>
  <div class="grid">
    <button onclick="seleccionarServicio(this,'Corte')">Corte</button>
    <button onclick="seleccionarServicio(this,'Corte + tinte')">Corte + tinte</button>
    <button onclick="seleccionarServicio(this,'Tinte')">Tinte</button>
  </div>
</section>

<section id="dias" class="seccion oculto">
  <h2>Día</h2>
  <div id="calendario" class="grid"></div>
</section>

<section id="horas" class="seccion oculto">
  <h2>Hora</h2>
  <h3>Mañana</h3>
  <div id="manana" class="grid"></div>
  <h3>Tarde</h3>
  <div id="tarde" class="grid"></div>
</section>

<section id="formulario" class="seccion oculto">
  <form onsubmit="reservar(event)">
    <input id="nombre" placeholder="Nombre" required>
    <input id="telefono" placeholder="Teléfono" required>
    <button type="submit">Confirmar</button>
  </form>
</section>
